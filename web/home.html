<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FlySmart">
  <meta name="theme-color" content="#282c31">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23282c31' width='180' height='180'/><text x='50%' y='50%' font-size='80' fill='%23e4dc2d' text-anchor='middle' dominant-baseline='central' font-weight='bold' font-family='Gill Sans MT Condensed'>FS</text></svg>">
  <title>FlySmart Replica - Home</title>
  <style>
    @font-face {
      font-family: "Gill Sans MT Condensed";
      src:
        local("Gill Sans MT Condensed"),
        local("GillSansMTCondensed"),
        url("./fonts/GillSansMTCondensed-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Gill Sans MT Condensed";
      src:
        local("Gill Sans MT Condensed"),
        local("GillSansMTCondensed"),
        url("./fonts/GillSansMTCondensed-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Bahnschrift Condensed";
      src:
        local("Bahnschrift Condensed"),
        local("Bahnschrift"),
        url("./fonts/BahnschriftCondensed-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Bahnschrift Condensed";
      src:
        local("Bahnschrift Condensed"),
        local("Bahnschrift"),
        url("./fonts/BahnschriftCondensed-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --base-width: 2360;
      --base-height: 1640;
      --viewport-width: 100vw;
      --viewport-height: 100vh;
      --edge-radius: 18px;
      --text-color: #f2f4f7;
      --shadow: 0 30px 90px rgba(0, 0, 0, 0.4);
      --panel-dark: #424449;
      --pencil-size: clamp(26px, 1.7vw, 38px);
    }

    * {
      box-sizing: border-box;
      font-family: "Gill Sans MT Condensed", "Arial Narrow", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    img,
    button,
    a {
      -webkit-user-drag: none;
    }

    button,
    .key-btn,
    .edit-key-btn,
    .wind-key-btn,
    .airport-option,
    .rwy-option {
      touch-action: manipulation;
      -ms-touch-action: manipulation;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: var(--text-color);
      overscroll-behavior: none;
      touch-action: none;
      -ms-touch-action: none;
    }

    body {
      display: block;
      position: fixed;
      inset: 0;
      padding: 0;
    }

    .stage {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      margin: 0;
      transform: none;
      background-image: url("./home.png");
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    .top-glow {
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 16%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0));
      pointer-events: none;
    }

    .top-actions {
      position: absolute;
      top: clamp(12px, 2.3%, 34px);
      right: clamp(14px, 2.2%, 42px);
      display: flex;
      gap: clamp(8px, 0.8vw, 14px);
      z-index: 3;
    }

    .nav-warning {
      position: absolute;
      top: calc(clamp(17px, 2.3%, 39px) + 10px);
      left: clamp(18px, 2.2%, 48px);
      z-index: 3;
      margin: 0;
      color: #c51818;
      font-size: clamp(11px, 0.9vw, 18px);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.28);
      font-weight: 700;
      pointer-events: none;
    }

    .round-btn {
      width: clamp(28px, 2.1vw, 38px);
      height: clamp(28px, 2.1vw, 38px);
      border: 0;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: transparent;
      cursor: pointer;
      box-shadow: none;
      transition: transform 120ms ease, filter 120ms ease;
      padding: 0;
      overflow: hidden;
    }

    .round-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .round-btn:active {
      transform: translateY(0);
      filter: brightness(0.95);
    }

    .round-btn img {
      width: 74%;
      height: 74%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    #settingsBtn img {
      transform: translateY(1.5px);
    }

    .brightness-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: rgba(0, 0, 0, 0);
      z-index: 2;
      transition: background 180ms ease;
    }

    .stage.dim .brightness-layer {
      background: rgba(0, 0, 0, 0.24);
    }

    .btn-light img {
      width: 78%;
      height: 78%;
    }

    .home-panel {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      width: clamp(300px, 40%, 760px);
      border-radius: 10px;
      border: 1px solid #000000;
      background: rgba(151, 156, 163, 0.2);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      z-index: 3;
      padding: clamp(12px, 1vw, 16px);
    }

    .settings-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.22);
      z-index: 4;
      opacity: 0;
      pointer-events: none;
      transition: opacity 140ms ease;
    }

    .settings-panel {
      position: absolute;
      left: var(--panel-left, 0px);
      top: var(--panel-top, 0px);
      width: 456px;
      border-radius: 10px;
      border: 1px solid #000000;
      background: linear-gradient(180deg, #8a919c 0%, #656d78 100%);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      z-index: 5;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 140ms ease;
      max-height: calc(100% - 24px);
      overflow: visible;
    }

    .settings-panel::before {
      content: "";
      position: absolute;
      top: -13px;
      left: var(--arrow-x, 392px);
      transform: translateX(-50%);
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 13px solid #000000;
      z-index: 1;
    }

    .settings-panel::after {
      content: "";
      position: absolute;
      top: -12px;
      left: var(--arrow-x, 392px);
      transform: translateX(-50%);
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-bottom: 12px solid #878e99;
      z-index: 2;
    }

    .stage.settings-open .settings-backdrop,
    .stage.settings-open .settings-panel {
      opacity: 1;
      pointer-events: auto;
    }

    .settings-panel,
    .settings-panel *,
    .edit-modal-content,
    .edit-modal-content * {
      font-family: "Bahnschrift Condensed", "Arial Narrow", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .simbrief-field {
      position: relative;
      width: 75%;
      margin: 0 auto 18px;
    }

    .simbrief-label {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #ffffff;
      font-size: 24px;
      letter-spacing: 0.2px;
      pointer-events: none;
      z-index: 1;
    }

    .simbrief-display {
      width: 100%;
      height: 52px;
      border: 1px solid #000000;
      border-radius: 8px;
      background: rgba(57, 60, 66, 0.92);
      box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.06), inset 0 -2px 6px rgba(0, 0, 0, 0.35);
      color: #e8da32;
      padding: 0 12px 0 180px;
      font-size: 24px;
      letter-spacing: 0.2px;
      outline: none;
      text-align: right;
      caret-color: transparent;
    }

    .simbrief-display::placeholder {
      color: transparent;
    }

    .settings-keypad {
      width: 75%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .settings-keypad .key-btn {
      width: 100%;
      height: 42px;
      border: 1px solid #5f6670;
      border-radius: 6.75px;
      background: linear-gradient(180deg, #f7f9fb 0%, #e2e7ec 100%);
      color: #4f5b64;
      font-size: 12.75px;
      font-weight: 700;
      cursor: pointer;
      line-height: 1;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.95),
        0 2px 0 rgba(54, 61, 69, 0.45);
    }

    .settings-keypad .key-btn:active {
      transform: translateY(1px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.75),
        0 1px 0 rgba(54, 61, 69, 0.45);
      filter: brightness(0.98);
    }

    .settings-keypad .key-btn.empty {
      background: transparent;
      border-color: transparent;
      box-shadow: none;
      pointer-events: none;
    }

    .settings-keypad .key-btn.action {
      font-size: 11.25px;
      letter-spacing: 0.1px;
    }

    .settings-keypad .key-btn.muted {
      background: linear-gradient(180deg, #c7ccd3 0%, #afb6c0 100%);
      color: #7d8791;
      text-shadow: none;
    }

    .settings-keypad .key-btn.sign {
      font-size: 11.25px;
    }

    .settings-keypad .key-btn[data-key="0"],
    .settings-keypad .key-btn[data-key="1"],
    .settings-keypad .key-btn[data-key="2"],
    .settings-keypad .key-btn[data-key="3"],
    .settings-keypad .key-btn[data-key="4"],
    .settings-keypad .key-btn[data-key="5"],
    .settings-keypad .key-btn[data-key="6"],
    .settings-keypad .key-btn[data-key="7"],
    .settings-keypad .key-btn[data-key="8"],
    .settings-keypad .key-btn[data-key="9"] {
      font-size: 19.125px;
    }

    .settings-keypad .key-btn.action[data-action="done"],
    .settings-keypad .key-btn.action[data-action="next"] {
      font-size: 15.525px;
    }

    .settings-keypad .key-btn.action[data-action="backspace"] {
      font-size: 0;
      padding: 0;
      display: grid;
      place-items: center;
    }

    .simbrief-backspace-icon {
      width: 22px;
      height: 22px;
      display: block;
      pointer-events: none;
    }

    .settings-std-list {
      width: 75%;
      margin: 18px auto 0;
      border: 1px solid #000000;
      border-radius: 8px;
      background: rgba(57, 60, 66, 0.92);
      box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.06), inset 0 -2px 6px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    .settings-std-btn {
      width: 100%;
      min-height: 44px;
      border: 0;
      border-top: 1px solid rgba(186, 193, 204, 0.14);
      background: transparent;
      color: #f0f3f6;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      text-align: left;
      cursor: pointer;
    }

    .settings-std-btn:first-child {
      border-top: 0;
    }

    .settings-std-btn:hover,
    .settings-std-btn:focus-visible {
      background: rgba(87, 193, 235, 0.14);
      outline: none;
    }

    .settings-std-label {
      color: #f0f3f6;
      font-size: 18px;
      line-height: 1;
      letter-spacing: 0.2px;
    }

    .settings-std-value {
      color: #57c1eb;
      font-size: 18px;
      line-height: 1;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    .settings-std-value::after {
      content: ">";
      margin-left: 4px;
      color: #f0f3f6;
    }

    .settings-choice-panel {
      position: absolute;
      left: 20px;
      right: 20px;
      top: 20px;
      bottom: 20px;
      border-radius: 8px;
      border: 1px solid #000000;
      background: linear-gradient(180deg, #8a919c 0%, #656d78 100%);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      padding: 10px;
      z-index: 3;
      opacity: 0;
      pointer-events: none;
      transition: opacity 140ms ease;
      display: flex;
      flex-direction: column;
    }

    .settings-choice-panel.active {
      opacity: 1;
      pointer-events: auto;
    }

    .settings-choice-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .settings-choice-spacer {
      width: 48px;
      flex: 0 0 48px;
    }

    .settings-choice-title {
      margin: 0;
      flex: 1;
      text-align: center;
      color: #ffffff;
      font-size: 22px;
      line-height: 1;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .settings-choice-close {
      min-width: 48px;
      height: 30px;
      border: 1px solid rgba(189, 196, 208, 0.7);
      border-radius: 6px;
      background: linear-gradient(180deg, #ffffff 0%, #e8ebef 100%);
      color: #42454b;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      line-height: 1;
    }

    .settings-choice-help {
      margin: 0 0 10px;
      color: #edf1f5;
      font-size: 16px;
      text-align: left;
      line-height: 1.3;
      letter-spacing: 0.1px;
      white-space: pre-line;
    }

    .settings-choice-options {
      margin-top: 2px;
      border: 1px solid rgba(186, 193, 204, 0.2);
      border-radius: 8px;
      background: rgba(57, 60, 66, 0.92);
      overflow: auto;
    }

    .settings-choice-option {
      width: 100%;
      border: 0;
      border-top: 1px solid rgba(186, 193, 204, 0.14);
      background: transparent;
      color: #f0f3f6;
      font-size: 20px;
      letter-spacing: 0.2px;
      text-align: left;
      padding: 11px 12px;
      cursor: pointer;
      line-height: 1.2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .settings-choice-option:first-child {
      border-top: 0;
    }

    .settings-choice-option:hover,
    .settings-choice-option:focus-visible {
      background: rgba(87, 193, 235, 0.14);
      outline: none;
    }

    .settings-choice-option.active {
      background: rgba(87, 193, 235, 0.2);
    }

    .settings-choice-check {
      width: 18px;
      height: 18px;
      display: block;
      object-fit: contain;
      opacity: 0;
      flex: 0 0 18px;
    }

    .settings-choice-option.active .settings-choice-check {
      opacity: 1;
    }

    .flight-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-dark);
      border-radius: 8px;
      padding: clamp(10px, 1vw, 14px) clamp(14px, 1.2vw, 20px);
      margin-bottom: 12px;
      border: 1px solid #000000;
      box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.06), inset 0 -2px 6px rgba(0, 0, 0, 0.35);
    }

    .flight-title {
      margin: 0;
      font-size: clamp(22.4px, 1.6vw, 30.4px);
      line-height: 1;
      letter-spacing: 0.5px;
      color: #f1f3f5;
    }

    .flight-sub {
      margin: 4px 0 0;
      font-size: clamp(12.8px, 0.8vw, 15.2px);
      color: #d8dbe0;
      letter-spacing: 0.2px;
    }

    .update-btn {
      border: 1px solid rgba(189, 196, 208, 0.7);
      border-radius: 7px;
      padding: 8px 14px;
      background: linear-gradient(180deg, #8a919c 0%, #656d78 100%);
      color: #f5f8ff;
      font-size: clamp(16px, 0.96vw, 19.2px);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      line-height: 1;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.4);
    }

    .update-btn[disabled] {
      opacity: 0.7;
      cursor: wait;
    }

    .update-btn.missing-id {
      background: linear-gradient(180deg, #d64f4f 0%, #a32222 100%);
      border-color: rgba(255, 170, 170, 0.8);
      color: #fff6f6;
    }

    .update-btn.load-error {
      background: linear-gradient(180deg, #f0d95a 0%, #c8a826 100%);
      border-color: rgba(255, 239, 163, 0.85);
      color: #3b3212;
      text-shadow: none;
    }

    .info-card {
      margin-top: 10px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(55, 60, 67, 0.9);
      background: #3f4146;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .card-head {
      background: linear-gradient(180deg, #c8cdd3 0%, #8b939e 46%, #7b828c 100%);
      color: #f2f6ff;
      font-size: clamp(19.2px, 1.12vw, 23.2px);
      padding: 6px 14px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.45);
    }

    .card-row {
      min-height: clamp(48px, 3.2vw, 58px);
      border-top: 1px solid rgba(173, 176, 182, 0.55);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      color: #f1f3f5;
      background: var(--panel-dark);
    }

    .card-row:first-of-type {
      border-top: 0;
    }

    .row-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
    }

    .row-main {
      font-size: clamp(17.6px, 1.01vw, 21.6px);
      letter-spacing: 0.3px;
      text-transform: uppercase;
      line-height: 1;
    }

    .row-value {
      color: #e8da32;
      font-size: clamp(16px, 0.95vw, 20px);
      text-transform: uppercase;
      line-height: 1;
      text-align: right;
      margin-left: auto;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 46%;
    }

    .row-sub {
      color: #c6c9cd;
      font-size: clamp(12.2px, 0.64vw, 14.1px);
      margin-left: 6px;
      line-height: 1;
    }

    .row-edit-btn {
      width: var(--pencil-size);
      height: var(--pencil-size);
      border: 0;
      background: transparent;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex: 0 0 auto;
      align-self: center;
      margin-left: -5px;
      padding: 0;
      transition: transform 120ms ease, filter 120ms ease;
    }

    .row-edit-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .row-edit-btn:active {
      transform: translateY(0);
      filter: brightness(0.95);
    }

    .row-pencil {
      width: var(--pencil-size);
      height: var(--pencil-size);
      object-fit: contain;
      flex: 0 0 auto;
      pointer-events: none;
      user-select: none;
    }

    .panel-footer {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px 0 10px;
    }

    .takeoff-btn {
      border: 0;
      background: transparent;
      padding: 0;
      margin: 0;
      cursor: pointer;
      border-radius: 8px;
      transition: transform 120ms ease, filter 120ms ease;
    }

    .takeoff-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .takeoff-btn:active {
      transform: translateY(0);
      filter: brightness(0.96);
    }

    .takeoff-btn img {
      width: clamp(68px, 4.4vw, 92px);
      height: auto;
      opacity: 0.72;
      padding: 4px 8px;
      border: 0;
      border-radius: 8px;
      background: #c8c8c8;
      box-shadow: 0 0 10px rgba(120, 126, 136, 0.22);
      object-fit: contain;
      user-select: none;
    }

    @media (max-width: 900px) {
      body {
        padding: 8px;
      }

      .stage {
        width: 100%;
      }

      .home-panel {
        width: min(92%, 520px);
        top: 54%;
      }

      .settings-panel {
        width: min(92%, 456px);
      }

      .settings-keypad {
        gap: 12px;
      }

      .settings-std-list {
        width: 100%;
      }

      .simbrief-field {
        width: 100%;
      }

      .settings-choice-panel {
        left: 12px;
        right: 12px;
        top: 12px;
        bottom: 12px;
      }

      .settings-choice-title {
        font-size: 18px;
      }

      .settings-choice-help {
        font-size: 14px;
      }

      .settings-choice-option,
      .settings-std-label,
      .settings-std-value {
        font-size: 16px;
      }

      .flight-title {
        font-size: clamp(17.6px, 4.8vw, 24px);
      }

      .flight-sub {
        font-size: clamp(9.6px, 2.4vw, 12.8px);
      }

      .update-btn {
        font-size: clamp(11.2px, 2.8vw, 14.4px);
        padding: 6px 10px;
      }

      .card-head {
        font-size: clamp(12.8px, 3.52vw, 17.6px);
      }

      .row-main {
        font-size: clamp(11.2px, 3.2vw, 14.4px);
      }

      .row-sub {
        font-size: clamp(7.7px, 1.92vw, 9.6px);
      }
    }

    /* ────────────────────────────────────────────── */
    /* iPad Portrait Optimization (max 1024px) */
    /* ────────────────────────────────────────────── */
    @media only screen and (max-width: 1024px) and (orientation: portrait) {
      body {
        padding: 0;
      }

      .top-actions {
        top: clamp(10px, 2%, 28px);
        right: clamp(12px, 1.8%, 32px);
        gap: clamp(6px, 0.6vw, 10px);
      }

      .round-btn {
        width: clamp(24px, 1.8vw, 32px);
        height: clamp(24px, 1.8vw, 32px);
      }

      .home-panel {
        width: clamp(280px, 45%, 720px);
        padding: clamp(10px, 0.8vw, 14px);
      }

      .settings-panel {
        width: 420px;
        padding: 16px;
      }

      .nav-warning {
        font-size: clamp(10px, 0.8vw, 16px);
      }
    }

    /* ────────────────────────────────────────────── */
    /* iPad Landscape Optimization (max 1366px) */
    /* ────────────────────────────────────────────── */
    @media only screen and (max-width: 1366px) and (orientation: landscape) {
      body {
        padding: 0;
      }

      .top-actions {
        top: clamp(10px, 1.5%, 20px);
        right: clamp(12px, 1.5%, 22px);
        gap: clamp(6px, 0.5vw, 10px);
      }

      .round-btn {
        width: clamp(26px, 2vw, 36px);
        height: clamp(26px, 2vw, 36px);
      }

      .home-panel {
        width: clamp(300px, 42%, 740px);
        padding: clamp(10px, 0.9vw, 15px);
      }

      .settings-panel {
        width: 440px;
        padding: 18px;
      }

      .nav-warning {
        font-size: clamp(11px, 0.9vw, 17px);
      }
    }

    /* ────────────────────────────────────────────── */
    /* General iPad Touch Optimization */
    /* ────────────────────────────────────────────── */
    @media only screen and (max-width: 1366px) {
      /* Ensure touch targets are at least 44px × 44px */
      .round-btn {
        min-width: 44px;
        min-height: 44px;
      }

      /* Remove hover effects on touch devices */
      .round-btn:hover {
        transform: none;
      }

      /* Better scrolling performance */
      @supports (-webkit-touch-callout: none) {
        body {
          -webkit-font-smoothing: antialiased;
          -webkit-text-size-adjust: 100%;
        }
      }

      /* Prevent zooming on input focus */
      input,
      textarea,
      select {
        font-size: 16px;
      }

      /* Improve touch interaction */
      .home-panel,
      .settings-panel {
        -webkit-user-select: none;
        user-select: none;
      }
    }



    /* ────────────────────────────────────────────── */
    /* Edit Modal With Custom Keypad */
    /* ────────────────────────────────────────────── */
    .edit-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: flex-end;
    }

    .edit-modal.active {
      display: flex;
    }

    .edit-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
    }

    .edit-modal-content {
      position: relative;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      background: #f5f5f7;
      border-radius: 16px 16px 0 0;
      padding: 0;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.15);
      z-index: 101;
      display: flex;
      flex-direction: column;
    }

    .edit-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #e5e5e7;
      background: #fff;
      border-radius: 16px 16px 0 0;
    }

    .edit-modal-title {
      font-size: 14px;
      font-weight: 600;
      color: #000;
      flex: 1;
    }

    .edit-modal-close {
      width: 28px;
      height: 28px;
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 18px;
      color: #666;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: background 100ms;
      -webkit-appearance: none;
      appearance: none;
    }

    .edit-modal-close:active {
      background: #e5e5e7;
    }

    .edit-modal-input {
      border: 1px solid #d5d5d7;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 16px;
      margin: 12px 16px 16px 16px;
      font-family: inherit;
      box-sizing: border-box;
      background: #fff;
      color: #000;
      -webkit-appearance: none;
      appearance: none;
      caret-color: transparent;
    }

    .edit-modal-input:focus {
      outline: none;
      border-color: #0071e3;
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.1);
    }

    .edit-modal-keypad {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 8px;
      padding: 0 16px 16px;
    }

    .edit-key-btn {
      min-height: 44px;
      border: 1px solid #cfd2d7;
      border-radius: 8px;
      background: linear-gradient(180deg, #ffffff 0%, #e8ebef 100%);
      color: #2f3135;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }

    .edit-key-btn:active {
      transform: translateY(1px);
      filter: brightness(0.96);
    }

    .edit-key-btn.wide {
      grid-column: span 2;
    }

    .edit-key-btn.xwide {
      grid-column: span 3;
    }

    .edit-key-btn.action {
      background: linear-gradient(180deg, #bcc2c9 0%, #a8afb8 100%);
    }

    .edit-key-btn.confirm {
      background: linear-gradient(180deg, #2a80f7 0%, #1562d3 100%);
      border-color: #1459bf;
      color: #fff;
    }

    @media (max-height: 500px) {
      .edit-modal-content {
        border-radius: 0;
      }

      .edit-modal-input {
        margin: 8px;
        padding: 10px 12px;
      }

      .edit-modal-keypad {
        gap: 6px;
        padding: 0 8px 8px;
      }

      .edit-key-btn {
        min-height: 38px;
        font-size: 14px;
      }
    }

    /* ─── Portrait orientation lock overlay ─── */
    #rotate-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #1b1c1e;
      color: #ffffff;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      font-family: "Gill Sans MT Condensed", "Arial Narrow", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 32px;
      touch-action: none;
    }
    #rotate-overlay svg {
      width: 90px;
      height: 90px;
      animation: rotate-hint 1.4s ease-in-out infinite alternate;
    }
    @keyframes rotate-hint {
      from { transform: rotate(-18deg); }
      to   { transform: rotate(18deg); }
    }
    #rotate-overlay .rotate-title {
      font-size: 22px;
      font-weight: 600;
      margin: 0;
      line-height: 1.4;
    }
    #rotate-overlay .rotate-sub {
      font-size: 15px;
      opacity: 0.55;
      margin: 0;
    }
    @media (orientation: portrait) {
      #rotate-overlay { display: flex; }
    }
  </style>
</head>

  <script>
    (() => {
      const blockedKeys = new Set([' ', 'Spacebar', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Home', 'End']);
      const interactiveSelector = 'button, input, select, textarea, a, [role="button"], .key-btn, .edit-key-btn, .wind-key-btn, .airport-option, .rwy-option';

      const preventGesture = (event) => {
        event.preventDefault();
      };

      document.addEventListener('gesturestart', preventGesture, { passive: false });
      document.addEventListener('gesturechange', preventGesture, { passive: false });
      document.addEventListener('gestureend', preventGesture, { passive: false });

      document.addEventListener('touchstart', (event) => {
        if (event.touches.length > 1) {
          event.preventDefault();
        }
      }, { passive: false });

      document.addEventListener('touchend', (event) => {
        if (!event.cancelable) {
          return;
        }

        const target = event.target;
        if (target instanceof Element && target.closest(interactiveSelector)) {
          return;
        }

        if (event.detail > 1) {
          event.preventDefault();
        }
      }, { passive: false });

      document.addEventListener('touchmove', preventGesture, { passive: false });
      document.addEventListener('wheel', preventGesture, { passive: false });
      document.addEventListener('dragstart', preventGesture, { passive: false });
      document.addEventListener('selectstart', preventGesture, { passive: false });

      document.addEventListener('keydown', (event) => {
        if (blockedKeys.has(event.key)) {
          event.preventDefault();
        }
      }, { passive: false });
    })();

    const syncViewportBounds = () => {
      const viewport = window.visualViewport;
      const width = viewport ? viewport.width : window.innerWidth;
      const height = viewport ? viewport.height : window.innerHeight;

      document.documentElement.style.setProperty('--viewport-width', `${Math.round(width)}px`);
      document.documentElement.style.setProperty('--viewport-height', `${Math.round(height)}px`);
    };

    syncViewportBounds();
    window.visualViewport?.addEventListener('resize', syncViewportBounds);
    window.visualViewport?.addEventListener('scroll', syncViewportBounds);
    window.addEventListener('resize', syncViewportBounds);
    window.addEventListener('orientationchange', syncViewportBounds);

    // Try to lock orientation to landscape (works in PWA / some browsers)
    if (screen.orientation?.lock) {
      screen.orientation.lock('landscape').catch(() => {});
    }

    const stage = document.querySelector('.stage');
    const brightnessBtn = document.querySelector('#brightnessBtn');
    const settingsBtn = document.querySelector('#settingsBtn');
    const settingsBackdrop = document.querySelector('#settingsBackdrop');
    const settingsPanel = document.querySelector('.settings-panel');
    const simbriefId = document.querySelector('#simbriefId');
    const updateBtn = document.querySelector('#updateBtn');
    const takeoffBtn = document.querySelector('#takeoffBtn');
    const aircraftTypeValue = document.querySelector('#aircraftTypeValue');
    const aircraftRegistrationValue = document.querySelector('#aircraftRegistrationValue');
    const weightVariantValue = document.querySelector('#weightVariantValue');
    const flightNumberValue = document.querySelector('#flightNumberValue');
    const fromValue = document.querySelector('#fromValue');
    const toValue = document.querySelector('#toValue');
    const rowEditButtons = document.querySelectorAll('.row-edit-btn');
    const keypadButtons = document.querySelectorAll('.settings-keypad .key-btn');
    const homeToThrustValue = document.querySelector('#homeToThrustValue');
    const homeConfValue = document.querySelector('#homeConfValue');
    const homeAirCondValue = document.querySelector('#homeAirCondValue');
    const settingsMenuButtons = document.querySelectorAll('[data-settings-menu]');
    const settingsChoicePanel = document.querySelector('#settingsChoicePanel');
    const settingsChoiceTitle = document.querySelector('#settingsChoiceTitle');
    const settingsChoiceHelp = document.querySelector('#settingsChoiceHelp');
    const settingsChoiceOptions = document.querySelector('#settingsChoiceOptions');
    const settingsChoiceClose = document.querySelector('#settingsChoiceClose');

    // Edit Modal Variables
    const editModal = document.querySelector('#editModal');
    const editModalLabel = document.querySelector('#editModalLabel');
    const editModalInput = document.querySelector('#editModalInput');
    const editModalClose = document.querySelector('#editModalClose');
    const editModalBackdrop = editModal?.querySelector('.edit-modal-backdrop');
    const editKeyButtons = document.querySelectorAll('[data-edit-key]');
    const editActionButtons = document.querySelectorAll('[data-edit-action]');

    let editModalCurrentField = null;

    const suppressKeyboard = (element) => {
      if (!element) {
        return;
      }

      const blockEvent = (event) => {
        event.preventDefault();
        element.blur();
      };

      element.addEventListener('focus', () => element.blur());
      element.addEventListener('touchstart', blockEvent, { passive: false });
      element.addEventListener('pointerdown', blockEvent);
      element.addEventListener('mousedown', blockEvent);
    };
    
    const markMissingSimbriefId = () => {
      if (!updateBtn) {
        return;
      }

      updateBtn.classList.add('missing-id');
      window.setTimeout(() => updateBtn.classList.remove('missing-id'), 1200);
    };

    const markLoadError = () => {
      if (!updateBtn) {
        return;
      }

      updateBtn.classList.add('load-error');
      window.setTimeout(() => updateBtn.classList.remove('load-error'), 1500);
    };

    const storageKey = 'flysmart-simbrief-id';
    const overridesStorageKey = 'flysmart-manual-overrides';
    const takeoffHeaderStorageKey = 'flysmart-takeoff-header';
    const takeoffAirportStorageKey = 'flysmart-takeoff-airport';
    const takeoffRunwayStorageKey = 'flysmart-takeoff-rwy';
    const takeoffWindStorageKey = 'flysmart-takeoff-wind';
    const takeoffOatStorageKey = 'flysmart-takeoff-oat';
    const takeoffQnhStorageKey = 'flysmart-takeoff-qnh';
    const takeoffToThrustStorageKey = 'flysmart-takeoff-to-thrust';
    const takeoffConfStorageKey = 'flysmart-takeoff-conf';
    const takeoffAirCondStorageKey = 'flysmart-takeoff-air-cond';
    const takeoffRwyCondStorageKey = 'flysmart-takeoff-rwy-cond';
    const takeoffAIceStorageKey = 'flysmart-takeoff-aice';

    const SETTINGS_MENU_CONFIG = {
      'to-thrust': {
        title: 'T.O. THRUST',
        help: 'Select T.O. THRUST default from the list.',
        storageKey: takeoffToThrustStorageKey,
        defaultValue: 'FLEX (STD)',
        options: ['TOGA', 'FLEX (STD)'],
        valueElement: homeToThrustValue
      },
      conf: {
        title: 'CONF',
        help: 'Select CONF default from the list.',
        storageKey: takeoffConfStorageKey,
        defaultValue: 'OPT CONF (STD)',
        options: ['CONF 1+F', 'CONF 2', 'CONF 3', 'OPT CONF (STD)'],
        valueElement: homeConfValue
      },
      'air-cond': {
        title: 'AIR COND',
        help: 'Select AIR COND default from the list.',
        storageKey: takeoffAirCondStorageKey,
        defaultValue: 'On (STD)',
        options: ['Off', 'On (STD)'],
        valueElement: homeAirCondValue
      }
    };

    let activeSettingsMenu = null;

    const valueElements = {
      aircraftType: aircraftTypeValue,
      aircraftRegistration: aircraftRegistrationValue,
      weightVariant: weightVariantValue,
      flightNumber: flightNumberValue,
      from: fromValue,
      to: toValue
    };

    const fieldLabels = {
      aircraftType: 'Aircraft Type',
      aircraftRegistration: 'Aircraft Registration',
      weightVariant: 'Weight Variant',
      flightNumber: 'Flight Number',
      from: 'From',
      to: 'To'
    };

    const loadManualOverrides = () => {
      try {
        const raw = localStorage.getItem(overridesStorageKey);
        if (!raw) {
          return {};
        }

        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === 'object' ? parsed : {};
      } catch {
        return {};
      }
    };

    let manualOverrides = loadManualOverrides();

    const saveManualOverrides = () => {
      localStorage.setItem(overridesStorageKey, JSON.stringify(manualOverrides));
    };

    const applyManualOverrides = () => {
      for (const [field, value] of Object.entries(manualOverrides)) {
        if (!(field in valueElements)) {
          continue;
        }

        const element = valueElements[field];
        if (!element) {
          continue;
        }

        element.textContent = (value || '').trim();
      }
    };

    const setAircraftValues = ({ type = '', registration = '', weight = '' }) => {
      aircraftTypeValue.textContent = type;
      aircraftRegistrationValue.textContent = registration;
      weightVariantValue.textContent = weight;
    };

    const setFlightValues = ({ flightNumber = '', from = '', to = '' }) => {
      flightNumberValue.textContent = flightNumber;
      fromValue.textContent = from;
      toValue.textContent = to;
    };

    const saveTakeoffHeaderData = () => {
      const registration = (aircraftRegistrationValue?.textContent || '').trim();
      const type = (aircraftTypeValue?.textContent || '').trim();
      const from = (fromValue?.textContent || '').trim();
      localStorage.setItem(takeoffHeaderStorageKey, JSON.stringify({ registration, type, from }));
    };

    const normalizeSettingsMenuValue = (menuKey, value) => {
      const config = SETTINGS_MENU_CONFIG[menuKey];
      if (!config) {
        return '';
      }

      const cleaned = String(value || '').trim();
      const matched = config.options.find((option) => option.toLowerCase() === cleaned.toLowerCase());
      return matched || config.defaultValue;
    };

    const withoutStdSuffix = (value) => String(value || '').replace(/\s*\(STD\)$/i, '').trim();

    const withStdSuffix = (value) => `${withoutStdSuffix(value)} (STD)`;

    const getSettingsMenuValue = (menuKey) => {
      const config = SETTINGS_MENU_CONFIG[menuKey];
      if (!config) {
        return '';
      }

      return normalizeSettingsMenuValue(menuKey, localStorage.getItem(config.storageKey) || config.defaultValue);
    };

    const setSettingsMenuValue = (menuKey, value) => {
      const config = SETTINGS_MENU_CONFIG[menuKey];
      if (!config) {
        return;
      }

      localStorage.setItem(config.storageKey, normalizeSettingsMenuValue(menuKey, value));
      renderSettingsMenuValues();
    };

    const renderSettingsMenuValues = () => {
      Object.entries(SETTINGS_MENU_CONFIG).forEach(([menuKey, config]) => {
        if (!config.valueElement) {
          return;
        }

        config.valueElement.textContent = withStdSuffix(getSettingsMenuValue(menuKey));
      });
    };

    const closeSettingsChoicePanel = () => {
      activeSettingsMenu = null;
      settingsChoicePanel?.classList.remove('active');
      settingsChoicePanel?.setAttribute('aria-hidden', 'true');
      if (settingsChoiceOptions) {
        settingsChoiceOptions.innerHTML = '';
      }
    };

    const openSettingsChoicePanel = (menuKey) => {
      const config = SETTINGS_MENU_CONFIG[menuKey];
      if (!config || !settingsChoicePanel || !settingsChoiceTitle || !settingsChoiceHelp || !settingsChoiceOptions) {
        return;
      }

      activeSettingsMenu = menuKey;
      const currentValue = getSettingsMenuValue(menuKey);

      settingsChoiceTitle.textContent = config.title;
      settingsChoiceHelp.textContent = config.help;
      settingsChoiceOptions.innerHTML = '';

      config.options.forEach((option) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'settings-choice-option';
        button.classList.toggle('active', option === currentValue);
        const optionLabel = option === currentValue ? withStdSuffix(option) : withoutStdSuffix(option);
        button.innerHTML = `<span>${optionLabel}</span><img class="settings-choice-check" src="./v.png" alt="" aria-hidden="true">`;
        button.addEventListener('click', () => {
          setSettingsMenuValue(menuKey, option);
          closeSettingsChoicePanel();
        });
        settingsChoiceOptions.appendChild(button);
      });

      settingsChoicePanel.classList.add('active');
      settingsChoicePanel.setAttribute('aria-hidden', 'false');
    };

    const clearTakeoffSavedData = () => {
      localStorage.removeItem(takeoffAirportStorageKey);
      localStorage.removeItem(takeoffRunwayStorageKey);
      localStorage.removeItem(takeoffWindStorageKey);
      localStorage.removeItem(takeoffOatStorageKey);
      localStorage.removeItem(takeoffQnhStorageKey);
      localStorage.removeItem(takeoffRwyCondStorageKey);
      localStorage.removeItem(takeoffAIceStorageKey);
    };

    const editFieldValue = (field) => {
      editModalCurrentField = field;
      const label = fieldLabels[field] || field;
      const element = valueElements[field];

      if (!element) {
        return;
      }

      const currentText = (element.textContent || '').trim();
      editModalLabel.textContent = `Modifica ${label}`;
      editModalInput.value = currentText;

      if (editModal) {
        editModal.classList.add('active');
        editModal.setAttribute('aria-hidden', 'false');
      }
    };

    const closeEditModal = (save = false) => {
      if (!editModal || editModalCurrentField === null) {
        return;
      }

      const field = editModalCurrentField;
      const element = valueElements[field];

      if (save && element) {
        const normalized = editModalInput.value.trim();
        element.textContent = normalized;
        manualOverrides[field] = normalized;
        saveManualOverrides();
        
        if (field === 'aircraftType' || field === 'aircraftRegistration') {
          saveTakeoffHeaderData();
        }
      }

      editModal.classList.remove('active');
      editModal.setAttribute('aria-hidden', 'true');
      editModalCurrentField = null;
      editModalInput.value = '';
    };

    const appendEditModalValue = (chunk) => {
      if (!editModalInput) {
        return;
      }

      editModalInput.value += chunk;
    };

    const handleEditModalAction = (action) => {
      if (!editModalInput) {
        return;
      }

      if (action === 'backspace') {
        editModalInput.value = editModalInput.value.slice(0, -1);
        return;
      }

      if (action === 'clear') {
        editModalInput.value = '';
        return;
      }

      if (action === 'cancel') {
        closeEditModal(false);
        return;
      }

      if (action === 'save') {
        closeEditModal(true);
      }
    };

    const toDisplayWeight = (value) => {
      if (value === undefined || value === null || value === '') {
        return '';
      }

      const number = Number(value);
      if (Number.isFinite(number)) {
        // SimBrief can return either tons or kilograms depending on source data.
        const tonsValue = Math.abs(number) >= 1000 ? (number / 1000) : number;
        return tonsValue % 1 === 0 ? `${tonsValue}` : tonsValue.toFixed(1);
      }

      return String(value);
    };

    const formatWeightVariant = (mtow, mlw, mzfw) => {
      return [toDisplayWeight(mtow), toDisplayWeight(mlw), toDisplayWeight(mzfw)].join('/');
    };

    const getNestedValue = (source, paths) => {
      for (const path of paths) {
        let current = source;

        for (const key of path) {
          if (current && typeof current === 'object' && key in current) {
            current = current[key];
          } else {
            current = undefined;
            break;
          }
        }

        if (current !== undefined && current !== null && current !== '') {
          return current;
        }
      }

      return '';
    };

    const parseAcdata = (data) => {
      const raw = getNestedValue(data, [
        ['params', 'acdata'],
        ['general', 'acdata'],
        ['acdata']
      ]);

      if (!raw) {
        return {};
      }

      if (typeof raw === 'object') {
        return raw;
      }

      if (typeof raw === 'string') {
        try {
          return JSON.parse(raw);
        } catch {
          return {};
        }
      }

      return {};
    };

    const deepFindByKeys = (source, wantedKeys) => {
      if (!source || typeof source !== 'object') {
        return '';
      }

      const normalizedWanted = wantedKeys.map((key) => key.toLowerCase());
      const queue = [source];
      const visited = new Set();

      while (queue.length > 0) {
        const current = queue.shift();

        if (!current || typeof current !== 'object' || visited.has(current)) {
          continue;
        }

        visited.add(current);

        for (const [key, value] of Object.entries(current)) {
          const normalizedKey = key.toLowerCase();

          if (normalizedWanted.includes(normalizedKey) && value !== undefined && value !== null && value !== '') {
            return value;
          }

          if (value && typeof value === 'object') {
            queue.push(value);
          }
        }
      }

      return '';
    };

    const getWeightValue = (data, acdata, key) => {
      const value = getNestedValue(data, [
        ['weights', key],
        ['weights', key.toUpperCase()],
        ['aircraft', key],
        ['aircraft', key.toUpperCase()],
        ['airframe', key],
        ['airframe', key.toUpperCase()],
        ['general', key],
        ['general', key.toUpperCase()],
        ['params', key],
        ['params', key.toUpperCase()]
      ]);

      if (value !== '') {
        return value;
      }

      if (acdata && typeof acdata === 'object' && key in acdata) {
        return acdata[key];
      }

      const aliasMap = {
        mtow: ['max_tow', 'maxtow', 'max_takeoff_weight', 'maximum_takeoff_weight', 'tow_max'],
        mlw: ['max_ldw', 'max_law', 'max_lw', 'max_landing_weight', 'maximum_landing_weight', 'landing_weight_max'],
        mzfw: ['max_zfw', 'maximum_zero_fuel_weight', 'zero_fuel_weight_max']
      };

      return deepFindByKeys(data, [key, ...(aliasMap[key] || [])]);
    };

    const loadSimbriefData = async () => {
      const userId = simbriefId?.value.trim();

      if (!userId) {
        setAircraftValues({});
        setFlightValues({});
        markMissingSimbriefId();
        return;
      }

      updateBtn.disabled = true;
      updateBtn.textContent = 'Loading...';

      manualOverrides = {};
      saveManualOverrides();
      clearTakeoffSavedData();

      try {
        localStorage.setItem(storageKey, userId);

        const response = await fetch(`https://www.simbrief.com/api/xml.fetcher.php?userid=${encodeURIComponent(userId)}&json=1`, {
          method: 'GET'
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        const type = getNestedValue(data, [
          ['aircraft', 'icaocode'],
          ['aircraft', 'icao_code'],
          ['aircraft', 'type'],
          ['general', 'icao_aircraft'],
          ['general', 'aircraft_icao'],
          ['general', 'aircraft']
        ]);

        const registration = getNestedValue(data, [
          ['aircraft', 'reg'],
          ['aircraft', 'registration'],
          ['general', 'reg'],
          ['general', 'registration']
        ]);

        const acdata = parseAcdata(data);

        const mtow = getWeightValue(data, acdata, 'mtow');
        const mlw = getWeightValue(data, acdata, 'mlw');
        const mzfw = getWeightValue(data, acdata, 'mzfw');

        const flightNumberRaw = getNestedValue(data, [
          ['atc', 'callsign'],
          ['general', 'callsign'],
          ['params', 'callsign'],
          ['general', 'flight_number'],
          ['general', 'fltnum'],
          ['atc', 'flight_number'],
          ['params', 'fltnum']
        ]);

        const airlineCode = getNestedValue(data, [
          ['general', 'icao_airline'],
          ['general', 'airline_icao'],
          ['general', 'airline_iata'],
          ['params', 'airline']
        ]);

        const flightNumber = (flightNumberRaw || '').toString().trim() ||
          `${(airlineCode || '').toString().trim()}${getNestedValue(data, [['general', 'fltnum'], ['params', 'fltnum']])}`.trim();

        const origin = getNestedValue(data, [
          ['origin', 'icao_code'],
          ['origin', 'icao'],
          ['general', 'orig'],
          ['params', 'orig']
        ]);

        const destination = getNestedValue(data, [
          ['destination', 'icao_code'],
          ['destination', 'icao'],
          ['general', 'dest'],
          ['params', 'dest']
        ]);

        setAircraftValues({
          type: String(type || ''),
          registration: String(registration || ''),
          weight: formatWeightVariant(mtow, mlw, mzfw)
        });

        setFlightValues({
          flightNumber: String(flightNumber || ''),
          from: String(origin || ''),
          to: String(destination || '')
        });

        applyManualOverrides();
        saveTakeoffHeaderData();
        if (origin) {
          localStorage.setItem(takeoffAirportStorageKey, String(origin).trim().toUpperCase());
        }
      } catch (error) {
        console.error(error);
        markLoadError();
      } finally {
        updateBtn.disabled = false;
        updateBtn.innerHTML = '&#10227; Update';
      }
    };

    brightnessBtn?.addEventListener('click', () => {
      stage.classList.toggle('dim');
    });

    const savedSimbriefId = localStorage.getItem(storageKey);
    if (savedSimbriefId && simbriefId) {
      simbriefId.value = savedSimbriefId;
    }

    suppressKeyboard(simbriefId);
    suppressKeyboard(editModalInput);

    applyManualOverrides();
    saveTakeoffHeaderData();
    renderSettingsMenuValues();

    const closeSettings = () => {
      closeSettingsChoicePanel();
      stage.classList.remove('settings-open');
    };

    const positionSettingsPanel = () => {
      if (!stage || !settingsBtn || !settingsPanel) {
        return;
      }

      const stageRect = stage.getBoundingClientRect();
      const btnRect = settingsBtn.getBoundingClientRect();
      const panelWidth = settingsPanel.offsetWidth || 456;
      const panelHeight = settingsPanel.offsetHeight || 220;

      const btnCenterX = btnRect.left - stageRect.left + (btnRect.width / 2);
      const btnBottomY = btnRect.bottom - stageRect.top;
      const arrowOffsetX = 8;

      const desiredArrowOffset = panelWidth - 30;
      const minLeft = 10;
      const maxLeft = Math.max(minLeft, stageRect.width - panelWidth - 10);
      let panelLeft = btnCenterX - desiredArrowOffset;
      panelLeft = Math.min(Math.max(panelLeft, minLeft), maxLeft);

      const minTop = 12;
      const maxTop = Math.max(minTop, stageRect.height - panelHeight - 10);
      let panelTop = btnBottomY + 2;
      panelTop = Math.min(Math.max(panelTop, minTop), maxTop);

      const arrowX = Math.min(Math.max((btnCenterX + arrowOffsetX) - panelLeft, 16), panelWidth - 16);

      settingsPanel.style.setProperty('--panel-left', `${panelLeft}px`);
      settingsPanel.style.setProperty('--panel-top', `${panelTop}px`);
      settingsPanel.style.setProperty('--arrow-x', `${arrowX}px`);
    };

    settingsBtn?.addEventListener('click', () => {
      const willOpen = !stage.classList.contains('settings-open');
      stage.classList.toggle('settings-open');
      if (willOpen) {
        positionSettingsPanel();
      }
    });

    settingsBackdrop?.addEventListener('click', closeSettings);
    settingsChoiceClose?.addEventListener('click', closeSettingsChoicePanel);
    updateBtn?.addEventListener('click', loadSimbriefData);
    takeoffBtn?.addEventListener('click', () => {
      saveTakeoffHeaderData();
      window.location.href = './takeoff.html';
    });

    rowEditButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const field = button.dataset.editField;
        if (!field) {
          return;
        }

        editFieldValue(field);
        if (field === 'aircraftType' || field === 'aircraftRegistration') {
          saveTakeoffHeaderData();
        }
      });
    });

    simbriefId?.addEventListener('input', () => {
      updateBtn?.classList.remove('missing-id');
      updateBtn?.classList.remove('load-error');
    });

    settingsMenuButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const menuKey = button.getAttribute('data-settings-menu');
        if (!menuKey) {
          return;
        }

        openSettingsChoicePanel(menuKey);
      });
    });

    keypadButtons.forEach((button) => {
      button.addEventListener('click', () => {
        if (!simbriefId || button.classList.contains('empty') || button.dataset.disabled === 'true') {
          return;
        }

        const key = button.dataset.key;
        const action = button.dataset.action;

        if (key) {
          if (key === '.' && simbriefId.value.includes('.')) {
            return;
          }
          simbriefId.value += key;
          updateBtn?.classList.remove('missing-id');
          updateBtn?.classList.remove('load-error');
          return;
        }

        if (action === 'backspace') {
          simbriefId.value = simbriefId.value.slice(0, -1);
          updateBtn?.classList.remove('missing-id');
          updateBtn?.classList.remove('load-error');
          return;
        }

        if (action === 'clear') {
          simbriefId.value = '';
          updateBtn?.classList.remove('missing-id');
          updateBtn?.classList.remove('load-error');
          return;
        }

        if (action === 'sign') {
          simbriefId.value = simbriefId.value.startsWith('-')
            ? simbriefId.value.slice(1)
            : `-${simbriefId.value}`;
          updateBtn?.classList.remove('missing-id');
          updateBtn?.classList.remove('load-error');
          return;
        }

        if (action === 'done' || action === 'next') {
          closeSettings();
        }
      });
    });


    // Edit Modal Event Listeners
    editModalClose?.addEventListener('click', () => {
      closeEditModal(false);
    });

    editModalBackdrop?.addEventListener('click', () => {
      closeEditModal(false);
    });

    editKeyButtons.forEach((button) => {
      button.addEventListener('click', () => {
        appendEditModalValue(button.dataset.editKey || '');
      });
    });

    editActionButtons.forEach((button) => {
      button.addEventListener('click', () => {
        handleEditModalAction(button.dataset.editAction || '');
      });
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        if (activeSettingsMenu) {
          closeSettingsChoicePanel();
          return;
        }

        if (editModal?.classList.contains('active')) {
          closeEditModal(false);
        } else {
          closeSettings();
        }
      }
    });

    window.addEventListener('resize', () => {
      if (stage?.classList.contains('settings-open')) {
        positionSettingsPanel();
      }
    });
  </script>
</body>
</html>
